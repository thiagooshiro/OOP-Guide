<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Browser - Functional</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Recipe Browser</h1>
      <button id="surprise-btn">Surprise Me</button>
    </header>

    <div class="search-section">
      <input type="text" id="search-input" placeholder="Search by name...">
      <div class="filter-buttons">
        <button data-category="all" class="active">All</button>
        <button data-category="Beef">Beef</button>
        <button data-category="Chicken">Chicken</button>
        <button data-category="Dessert">Dessert</button>
        <button data-category="Pasta">Pasta</button>
        <button data-category="Seafood">Seafood</button>
      </div>
    </div>

    <div id="cards-container" class="cards"></div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <button class="modal-close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="main.js"></script>
</body>
</html>
